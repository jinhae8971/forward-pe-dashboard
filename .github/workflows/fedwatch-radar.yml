name: FedWatch Radar

# 기존 레포(TELEGRAM_TOKEN 보유)의 fedwatch/ 서브디렉터리에 얹어 쓰는 변형.
# 신규 레포로 단독 운영할 때는 .github/workflows/fedwatch-radar.yml 를 쓴다.

on:
  schedule:
    - cron: "30 22 * * 1-5"   # KST 화~토 07:30
  workflow_dispatch:
    inputs:
      skip_notify:
        description: "텔레그램 발송 없이 계산만 (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: fedwatch-radar
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: fedwatch

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  run:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt

      - name: Run FedWatch radar
        env:
          # 이 레포는 계산·커밋만 담당한다. 발송은 전략 Agent 토큰을 가진
          # hynix-correction-monitor 의 fedwatch-relay 워크플로우가 대행한다.
          # (텔레그램 자격증명을 넘기지 않으므로 여기서는 항상 발송 생략된다)
          SKIP_NOTIFY: ${{ inputs.skip_notify }}
          TZ: "Asia/Seoul"
        run: |
          set -euo pipefail
          if [[ -n "${SKIP_NOTIFY:-}" && ! "${SKIP_NOTIFY}" =~ ^(true|false)$ ]]; then
            echo "::error::skip_notify 입력 형식 오류 (true/false): ${SKIP_NOTIFY}"
            exit 1
          fi
          if [[ "${SKIP_NOTIFY:-false}" == "true" ]]; then
            echo "발송은 릴레이가 담당 - skip_notify 는 무의미"
          fi
          python fedwatch_radar.py

      - name: Commit data
        working-directory: .
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fedwatch/data/
          if git diff --cached --quiet; then
            echo "변경 없음 - 커밋 생략"
            exit 0
          fi
          git commit -m "chore: fedwatch snapshot $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            sleep $((i * 5))
          done
          echo "::error::3회 시도 후에도 푸시 실패"; exit 1

      - name: Notify failure
        if: failure()
        working-directory: .
        env:
          TELEGRAM_TOKEN: ${{ secrets.FEDWATCH_TELEGRAM_TOKEN || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.FEDWATCH_TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=$(printf '%s\n%s' '❌ FedWatch 레이더 실행 실패' "${RUN_URL}")" \
            || true
