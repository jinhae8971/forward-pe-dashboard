<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>메모리 반도체 4사 포워드 P/E 대시보드</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0b1020; --panel:#141b30; --panel2:#1b2440; --line:#27314f;
    --txt:#e8edf7; --muted:#93a0bd; --accent:#5b8cff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:linear-gradient(160deg,#0b1020,#0e1530);color:var(--txt);
    font-family:'Segoe UI',-apple-system,'Malgun Gothic',sans-serif;padding:28px}
  .wrap{max-width:1080px;margin:0 auto}
  h1{font-size:24px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:10px}
  .stamp{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:22px;font-size:11.5px}
  .pill{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 11px;color:var(--muted)}
  .pill.warn{background:#3a2418;border-color:#7a4a22;color:#ffb454}
  .pill.live{background:#12301f;border-color:#1f6b42;color:#3ecf8e}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;position:relative;overflow:hidden}
  .card .bar{position:absolute;left:0;top:0;height:4px;width:100%}
  .card .name{font-size:14px;font-weight:600}
  .card .ticker{color:var(--muted);font-size:11px;margin-bottom:10px}
  .card .pe{font-size:30px;font-weight:700;line-height:1}
  .card .pe span{font-size:13px;color:var(--muted);font-weight:400}
  .card .delta{font-size:11px;margin-top:6px}
  .card .flag{position:absolute;right:10px;top:12px;font-size:9.5px;color:#ffb454;
    border:1px solid #7a4a22;border-radius:5px;padding:1px 5px}
  .up{color:#ff6b6b}.down{color:#3ecf8e}.flat{color:var(--muted)}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}
  .toolbar{display:flex;gap:8px;margin-bottom:14px;align-items:center;flex-wrap:wrap}
  .toolbar button{background:var(--panel2);color:var(--txt);border:1px solid var(--line);
    border-radius:9px;padding:7px 13px;font-size:12.5px;cursor:pointer}
  .toolbar button.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .chart-box{height:420px}
  .note{color:var(--muted);font-size:11.5px;margin-top:16px;line-height:1.6}
  .state{color:var(--muted);font-size:13px;padding:40px 0;text-align:center}
  .state.err{color:#ff6b6b}
  @media(max-width:760px){body{padding:18px}.grid{grid-template-columns:repeat(2,1fr)}.chart-box{height:340px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>메모리 반도체 4사 — 포워드 P/E 추세</h1>
  <div class="sub">삼성전자 · SK하이닉스 · 마이크론 · 샌디스크</div>
  <div class="stamp" id="stamp"></div>

  <div class="grid" id="cards"></div>

  <div class="panel">
    <div class="toolbar" id="toolbar" style="display:none">
      <button data-mode="trend" class="active">월별 추세</button>
      <button data-mode="daily">일별 추이</button>
      <button data-mode="current">현재값 비교</button>
      <span style="color:var(--muted);font-size:11.5px;margin-left:auto">범례를 클릭해 항목을 켜고 끌 수 있습니다</span>
    </div>
    <div id="state" class="state">데이터를 불러오는 중…</div>
    <div class="chart-box" id="chartBox" style="display:none"><canvas id="chart"></canvas></div>
    <div class="note" id="note"></div>
  </div>
</div>

<script>
const STALE_DAYS = 4;           // 이 기간 넘게 갱신이 없으면 경고 배지
let DATA = null, chart = null, mode = 'trend';

const $ = id => document.getElementById(id);
const fmt = v => (v === null || v === undefined) ? '—' : v.toFixed(2);

/* ---------- 로딩 ---------- */
async function boot(){
  try{
    const res = await fetch('data.json?t=' + Date.now(), {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    DATA = await res.json();
    if(!DATA.history || !DATA.history.length) throw new Error('수집 이력이 비어 있습니다');
    render();
  }catch(e){
    $('state').className = 'state err';
    $('state').textContent = '데이터를 불러오지 못했습니다 (' + e.message + '). 수집 워크플로우 실행 여부를 확인해 주세요.';
    $('stamp').innerHTML = '<span class="pill warn">데이터 로드 실패</span>';
  }
}

/* ---------- 시계열 조립 ---------- */
function monthKey(dateStr){ return dateStr.slice(2,4) + '.' + dateStr.slice(5,7); }

function addMonth(k){
  let [y,m] = k.split('.').map(Number);
  m += 1; if(m > 12){ m = 1; y += 1; }
  return String(y).padStart(2,'0') + '.' + String(m).padStart(2,'0');
}

// 월별: legacy 구간 + history의 월말(해당 월 마지막 관측) 값. 결측 월은 null → 그래프에 공백.
function monthlySeries(){
  const legacy = DATA.legacy || {months:[], series:{}};
  const monthEnd = {};                       // month -> {key: value}
  DATA.history.forEach(h => { monthEnd[monthKey(h.date)] = h.values; });

  const known = legacy.months.concat(Object.keys(monthEnd)).sort();
  const first = known[0], last = known[known.length - 1];

  const labels = [];
  for(let k = first; ; k = addMonth(k)){ labels.push(k); if(k === last) break; }

  const series = {};
  DATA.tickers.forEach(t => {
    series[t.key] = labels.map(k => {
      const li = legacy.months.indexOf(k);
      if(monthEnd[k] && monthEnd[k][t.key] != null) return monthEnd[k][t.key];
      if(li >= 0 && legacy.series[t.key]) return legacy.series[t.key][li];
      return null;
    });
  });
  return {labels, series};
}

function dailySeries(){
  const recent = DATA.history.slice(-60);
  const labels = recent.map(h => h.date.slice(5));
  const series = {};
  DATA.tickers.forEach(t => { series[t.key] = recent.map(h => h.values[t.key] ?? null); });
  return {labels, series};
}

/* 카드 델타 기준: 직전 월말 관측치, 없으면 legacy 마지막 값 */
function baseline(key){
  const cur = DATA.history[DATA.history.length - 1];
  const curM = monthKey(cur.date);
  for(let i = DATA.history.length - 2; i >= 0; i--){
    const h = DATA.history[i];
    if(monthKey(h.date) !== curM && h.values[key] != null){
      return {value:h.values[key], label:'전월말 대비'};
    }
  }
  const lg = DATA.legacy;
  if(lg && lg.series[key]){
    const arr = lg.series[key];
    return {value:arr[arr.length - 1], label:'26.05 대비'};
  }
  return {value:null, label:''};
}

/* ---------- 렌더 ---------- */
function renderStamp(){
  const meta = DATA.meta || {};
  const last = DATA.history[DATA.history.length - 1];
  const ageDays = Math.floor((Date.now() - new Date(last.date + 'T00:00:00+09:00')) / 86400000);
  const fresh = ageDays <= STALE_DAYS;
  const anyStale = last.stale && Object.keys(last.stale).length;

  let html = `<span class="pill ${fresh ? 'live' : 'warn'}">`
           + (fresh ? '● 갱신됨' : '● 갱신 지연 ' + ageDays + '일') + '</span>'
           + `<span class="pill">최종 수집 ${meta.updated_at || last.date}</span>`
           + `<span class="pill">출처 ${meta.source || 'Yahoo Finance'}</span>`;
  if(anyStale) html += `<span class="pill warn">일부 종목 직전값 유지</span>`;
  $('stamp').innerHTML = html;
}

function renderCards(){
  const last = DATA.history[DATA.history.length - 1];
  const box = $('cards'); box.innerHTML = '';
  DATA.tickers.forEach(t => {
    const cur = last.values[t.key];
    const b = baseline(t.key);
    let deltaHtml = '<div class="delta flat">비교 기준 없음</div>';
    if(cur != null && b.value != null){
      const diff = cur - b.value, pct = diff / b.value * 100;
      const cls = diff > 0 ? 'up' : (diff < 0 ? 'down' : 'flat');
      const arrow = diff > 0 ? '▲' : (diff < 0 ? '▼' : '▪');
      deltaHtml = `<div class="delta ${cls}">${arrow} ${Math.abs(diff).toFixed(2)} `
                + `(${pct >= 0 ? '+' : ''}${pct.toFixed(1)}%) ${b.label}</div>`;
    }
    const staleFlag = (last.stale && last.stale[t.key]) ? '<div class="flag">직전값</div>' : '';
    const el = document.createElement('div');
    el.className = 'card';
    el.innerHTML = `<div class="bar" style="background:${t.color}"></div>${staleFlag}
      <div class="name">${t.name}</div>
      <div class="ticker">${t.label}</div>
      <div class="pe">${fmt(cur)}<span>x</span></div>
      ${deltaHtml}`;
    box.appendChild(el);
  });
}

function lineConfig(src, xTitle){
  return {type:'line',
    data:{labels:src.labels, datasets:DATA.tickers.map(t => ({
      label:t.name, data:src.series[t.key], borderColor:t.color, backgroundColor:t.color,
      tension:0.3, borderWidth:2.5, pointRadius:3, pointHoverRadius:6, spanGaps:false}))},
    options:{responsive:true, maintainAspectRatio:false, interaction:{mode:'index', intersect:false},
      plugins:{legend:{labels:{color:'#cdd6ea', usePointStyle:true}},
        tooltip:{callbacks:{label:c => ` ${c.dataset.label}: ${c.parsed.y == null ? '—' : c.parsed.y.toFixed(2) + 'x'}`}}},
      scales:{
        x:{ticks:{color:'#cdd6ea', maxRotation:0, autoSkip:true}, grid:{color:'#1c2540'},
           title:{display:!!xTitle, text:xTitle, color:'#93a0bd'}},
        y:{ticks:{color:'#93a0bd', callback:v => v + 'x'}, grid:{color:'#27314f'},
           title:{display:true, text:'포워드 P/E (배수)', color:'#93a0bd'}}
      }}};
}

function barConfig(){
  const last = DATA.history[DATA.history.length - 1];
  return {type:'bar',
    data:{labels:DATA.tickers.map(t => t.name), datasets:[{label:'현재 포워드 P/E',
      data:DATA.tickers.map(t => last.values[t.key]),
      backgroundColor:DATA.tickers.map(t => t.color), borderRadius:8, maxBarThickness:70}]},
    options:{responsive:true, maintainAspectRatio:false,
      plugins:{legend:{labels:{color:'#cdd6ea'}},
        tooltip:{callbacks:{label:c => ` ${c.parsed.y.toFixed(2)}x`}}},
      scales:{
        x:{ticks:{color:'#cdd6ea', font:{size:13}}, grid:{display:false}},
        y:{beginAtZero:true, ticks:{color:'#93a0bd', callback:v => v + 'x'}, grid:{color:'#27314f'},
           title:{display:true, text:'배수 (x)', color:'#93a0bd'}}
      }}};
}

function render(){
  $('state').style.display = 'none';
  $('toolbar').style.display = 'flex';
  $('chartBox').style.display = 'block';
  renderStamp();
  renderCards();

  if(chart) chart.destroy();
  let cfg, note;
  const legacyNote = (DATA.legacy && DATA.legacy.note) ? DATA.legacy.note : '';
  if(mode === 'trend'){
    cfg = lineConfig(monthlySeries(), '월 (YY.MM)');
    note = `※ 각 월의 마지막 수집 관측치 기준입니다. ${legacyNote} 값이 없는 월은 그래프에서 공백으로 표시됩니다.`;
  }else if(mode === 'daily'){
    cfg = lineConfig(dailySeries(), '수집일 (MM-DD)');
    note = `※ 최근 60회 수집분의 일별 추이입니다. 평일 06:00 KST에 자동 수집됩니다.`;
  }else{
    cfg = barConfig();
    note = `※ 최신 수집 시점의 4사 포워드 P/E 비교입니다.`;
  }
  chart = new Chart($('chart'), cfg);
  $('note').textContent = note + ' 포워드 P/E는 향후 12개월 예상 EPS 기준이며, 데이터 제공처·산정 시점에 따라 편차가 있습니다. 투자 판단 근거가 아닌 참고용입니다.';
}

$('toolbar').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  document.querySelectorAll('#toolbar button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  mode = b.dataset.mode;
  render();
});

boot();
</script>
</body>
</html>
